plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.mre.android'
    compileSdk 35

    defaultConfig {
        applicationId project.findProperty('mre.applicationId') ?: 'dev.mre.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        resValue 'string', 'mre_app_label', project.findProperty('mre.label') ?: 'MRE App'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    flavorDimensions 'mode'
    productFlavors {
        dev {
            dimension 'mode'
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
        }
        prod {
            dimension 'mode'
        }
    }
}

configurations.all {
    // ZXing 4.3 still asks for Kotlin 1.6 JDK artifacts while Activity asks for
    // 1.8. Force one version: 1.8's JDK artifacts are empty shims, so there
    // are no duplicate classes in the dev APK.
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    // The dev flavour is a QR-pairing client. ZXing's ScanContract handles the
    // camera permission and the scanner Activity, so no CameraX plumbing is
    // needed. The release flavour has no scanner dependency at all.
    devImplementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    devImplementation 'androidx.activity:activity:1.9.0'
}
