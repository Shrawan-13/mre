plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.mre.android'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.mre.android'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // NativeActivity loads libmain.so; legacy packaging makes that
    // straightforward on every supported Android version.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
