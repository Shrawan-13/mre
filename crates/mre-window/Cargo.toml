[package]
name = "mre-window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop window host: winit + a software presenter."

[[bin]]
name = "mre"
path = "src/bin/mre.rs"

[dependencies]
mre-core = { workspace = true }
mre-runtime = { workspace = true }
mre-text = { workspace = true }
winit = "0.30"
softbuffer = "0.4"
# The only platform service the host owns. The engine is clipboard-agnostic:
# `App::copied_text`/`App::paste` take and return strings, so tests never touch
# a display server.
arboard = "3"
